server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
    }

    # Tile responses are cacheable for a long time: an orthomosaic is immutable
    # once ingested, and dynamic tiling recomputes every tile on every request.
    # Three agronomists opening the same field in one morning is otherwise three
    # full recomputations.
    location /tiles/ {
        proxy_pass http://titiler:8000/;
        proxy_cache_valid 200 30d;
        add_header X-Cache-Status $upstream_cache_status;
    }
}
