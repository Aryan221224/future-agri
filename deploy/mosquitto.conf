# Edge broker configuration.
#
# THE DEFAULTS WILL LOSE YOUR DATA. Mosquitto's max_queued_messages defaults to
# 1000 and queue_qos0_messages to false. Twenty sensors reporting four metrics
# once a minute is 80 messages/minute -- twelve minutes of buffer. A gateway
# that loses connectivity overnight, which is routine in rural deployment,
# silently discards the overwhelming majority of a night's readings with no
# error anywhere. Every line below exists because of that.

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

# Unlimited by count, bounded by BYTES. Setting max_queued_messages 0 without
# max_queued_bytes means a long outage fills the gateway disk and takes down the
# whole box -- trading silent data loss for loud total failure.
max_queued_messages 0
max_queued_bytes 536870912

# QoS 0 messages are not queued for disconnected clients at all by default.
queue_qos0_messages true

max_inflight_messages 40
autosave_interval 60

# Publish $SYS so bridge state can be monitored: a gateway whose bridge auth has
# expired can never drain, and you want to know that from a metric rather than
# from a farmer asking where last week's data went.
sys_interval 30
