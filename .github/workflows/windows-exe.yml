name: windows-exe
# Builds FutureAgri.exe (one folder, zipped) on Windows, checks that it starts and answers
# /api/health, and uploads it. A tag v* also attaches the zip to a GitHub release.
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths: ["services/**", "packages/**", "packaging/**", "vendor/**", ".github/workflows/windows-exe.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: services/console/requirements.txt}
      - name: Install
        working-directory: services/console
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.11.1
      - name: Build
        run: pyinstaller packaging/windows/futureagri.spec --noconfirm --clean
      - name: Smoke test (starts and answers /api/health)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\FutureAgri\FutureAgri.exe -ArgumentList '--no-browser','--port','8123' -PassThru `
               -RedirectStandardOutput smoke_out.txt -RedirectStandardError smoke_err.txt
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8123/api/health -TimeoutSec 5
                  if ($r.StatusCode -eq 200) { $ok = $true; break } } catch { }
            if ($p.HasExited) { break }
          }
          Get-Content smoke_out.txt, smoke_err.txt -ErrorAction SilentlyContinue | Select-Object -Last 60
          try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8123/ -TimeoutSec 5 | Out-Null } catch { $ok = $false }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if (-not $ok) { Write-Error "FutureAgri.exe did not answer /api/health"; exit 1 }
      - name: Zip
        shell: pwsh
        run: |
          Copy-Item packaging\windows\README.txt dist\FutureAgri\README.txt
          Compress-Archive -Path dist\FutureAgri -DestinationPath FutureAgri-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with: {name: FutureAgri-windows-x64, path: FutureAgri-windows-x64.zip, retention-days: 30}
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: {files: FutureAgri-windows-x64.zip}
