  locations:
    - {name: "Chanthaburi, Thailand (durian)", lat: 12.60, lon: 102.10, country: TH}
    - {name: "Riau, Indonesia (oil palm)", lat: 0.50, lon: 101.40, country: ID}
  field_ha: [1.0, 20.0]
  crop: durian
  variety: none
  sowing: "01-01"
  harvest: "12-31"
  irrigated: false
  diseases: [phytophthora]
  pests: [borers]
  weeds: false
  region: TH
  drone_use: "Low and slow single-tree routes; canopy penetration critical."
  supported: false
  unsupported_reason: "Perennial tree crops are not representable in WOFOST; a tree-crop model is required before twin runs."
