# Archetype farms for virtual testing -- from the research brief "Future Agri 2.0: Research
# Brief for a Global Crop + Spray-Drone Digital Twin" (31 Oct 2026). Values are design
# PRIORS: the farm builder overwrites them with real data for each sampled site (FTW
# boundary, SoilGrids, Copernicus DEM, NASA POWER weather, Sentinel-2 cover).
# Varieties are shipped WOFOST parameter sets; phenology is anchored to Sentinel-2.

A1:
  name: East-Asian smallholder paddy
  locations:
    - {name: "Niigata, Japan", lat: 37.90, lon: 139.00, country: JP}
    - {name: "Jiangsu, China", lat: 32.00, lon: 119.50, country: CN}
  field_ha: [0.1, 1.0]
  crop: rice
  variety: Rice_501
  sowing: "05-10"          # transplanting
  harvest: "09-25"
  irrigated: true
  diseases: [rice_blast, sheath_blight]
  pests: [planthoppers]
  weeds: true
  region: JP
  drone_use: "Contractor or cooperative; registered drone formulations; ~2 preventive sprays/season (Japan case farms 19-39 ha)."
  fidelity_note: "WOFOST has no paddy water layer; run as irrigated, flagged limited fidelity (ORYZA recommended)."
  sources:
    - "Sustainability 13:2618 (2021): Japan UAV-sprayed area 684 ha (2016) -> 31,020 ha (2018)"
    - "MAFF via Int. J. Agric. Sustain. (2023): cultivated area per worker 2.2 -> 3.1 ha (2010-2020)"

A2:
  name: Southeast-Asian rice
  locations:
