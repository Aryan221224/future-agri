    - "DJI Agricultural Drone Industry Insight Report 2023/24 (1,500-tree durian orchard case)"

A8:
  name: Large-scale cotton (defoliation)
  locations:
    - {name: "Xinjiang, China", lat: 44.30, lon: 86.00, country: CN}
  field_ha: [5.0, 50.0]
  crop: cotton
  variety: Cotton_VanHeemst_1988
  sowing: "04-20"
  harvest: "09-30"
  irrigated: true
  diseases: []
  pests: [aphids, mites]
  weeds: true
  region: CN
  drone_use: "Mass contractor defoliation campaigns (140,000 ha in one day, XAG 2020)."
  supported: false
  unsupported_reason: "Defoliant timing is the drone task here and no defoliation model exists; WOFOST cotton parameters are uncalibrated (engine.UNCALIBRATED)."
  sources:
    - "XAG press (2020): 140,000 ha single-day record, ~4.8 M ha cumulative Xinjiang cotton defoliation"
