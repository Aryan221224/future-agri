    - {name: "Central Plains, Thailand", lat: 15.00, lon: 100.20, country: TH}
  field_ha: [0.2, 3.0]
  crop: rice
  variety: Rice_IR64
  sowing: "04-20"          # summer-autumn crop
  harvest: "07-31"
  irrigated: true
  diseases: [rice_blast]
  pests: [brown_planthopper]
  weeds: true
  region: VN
  drone_use: "Service providers; high sortie counts per day; foliar fertiliser."
  fidelity_note: "WOFOST has no paddy water layer; run as irrigated, flagged limited fidelity."
  sources:
    - "DJI newsroom (May 2025): 50-fold sales growth in Thailand over 7 years (manufacturer claim)"
    - "FTW benchmark includes AI4SmallFarms Mekong labels"

A3:
  name: Brazilian soybean
  locations:
    - {name: "Sorriso, Mato Grosso, Brazil", lat: -12.50, lon: -55.70, country: BR}
    - {name: "Ribeirao Preto, Sao Paulo, Brazil", lat: -21.20, lon: -47.80, country: BR}
  field_ha: [20.0, 150.0]
  crop: soybean
  variety: Soybean_VanHeemst_1988
  sowing: "10-01"
  harvest: "02-01"
  irrigated: false
  diseases: [soybean_rust]
  pests: [stink_bugs]
  weeds: true
  region: BR
  drone_use: "Contractors under Portaria 298 on edges, wet patches and spot work; 20 m buffers; monthly MAPA reports."
  fidelity_note: "Generic Van Heemst soybean parameters; phenology anchored to Sentinel-2."
  sources:
    - "MAPA Portaria 298/2021 (gov.br)"
    - "DJI Agricultural Drone Industry Insight Report 2023/24"

A4:
  name: US corn
  locations:
    - {name: "Story County, Iowa, USA", lat: 42.00, lon: -93.50, country: US}
  field_ha: [30.0, 65.0]
  crop: maize
  variety: Grain_maize_204
  sowing: "05-01"
  harvest: "10-15"
  irrigated: false
  diseases: [tar_spot, gray_leaf_spot]
  pests: [soybean_aphid]
  weeds: true
  region: US
  drone_use: "Part 137 contractors at ~US$13/acre (ASDC 2025); VT/R1 fungicide, wet-soil and late-season work; 69% of operators fly <=2 drones."
  fidelity_note: "European grain-maize parameters; phenology anchored to Sentinel-2."
  sources:
    - "ASDC 2025 Impact Survey (Jan 2026): 16.4 M acres, 1,710 Part 137 UAS operators, US$13/acre"
    - "Iowa State 2026 custom rate survey: US$12.50/acre mean"

A5:
  name: European potato
  locations:
    - {name: "Flevoland, Netherlands", lat: 52.52, lon: 5.62, country: NL}
  field_ha: [5.0, 20.0]
  crop: potato
  variety: Fontane
  sowing: "04-20"
  harvest: "09-15"
  irrigated: false
  diseases: [late_blight]
  pests: []
  weeds: true
  region: EU
  drone_use: "Only under national derogation in the EU (default aerial-spraying ban, Directive 2009/128/EC Art. 9); Omnibus Art. 9a proposed (COM(2025)1021), Council position 27 May 2026."
  fidelity_note: "Dutch ware-potato variety shipped with WOFOST; late-blight model is the project's epidemic layer."
  sources:
    - "EU Council press release 27 May 2026; COM(2025) 1021"
    - "FTW global predictions: Flevoland fields median 18.5 ha (sampled 31 Oct 2026)"

